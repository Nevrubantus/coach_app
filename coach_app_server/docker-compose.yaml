services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: coach_app
      POSTGRES_PASSWORD: "0gq_ra9c1bG94g_Yw6r_hNd4RvGyzDGj"
    volumes:
      - coach_app_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "kyUWo4xSW_IXYqtUAneuDotRMrNk1r9-"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: coach_app_test
      POSTGRES_PASSWORD: "8cQXUfdE4iudDSC3tBtFfICli_9KOdvp"
    volumes:
      - coach_app_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "2hZBzQXnubmK559wUA3VI6HAzfTMxfyg"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  coach_app_data:
  coach_app_test_data:
